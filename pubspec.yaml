name: pregapp
description: Pregnancy companion — offline-first care, week tracking, and Ask Mira.
publish_to: "none"
version: 1.0.5+6

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.5
  go_router: ^16.2.0
  intl: ^0.20.2
  http: ^1.5.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.0
  uuid: ^4.5.1
  share_plus: ^11.1.0
  path_provider: ^2.1.5
  flutter_local_notifications: ^19.4.1
  home_widget: 0.7.0
  connectivity_plus: ^6.1.5
  google_sign_in: ^7.1.1
  sign_in_with_apple: ^7.0.1
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  crypto: ^3.0.6
  video_player: ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay.ttf
        - asset: assets/fonts/PlayfairDisplay-Italic.ttf
          style: italic
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
  assets:
    - assets/motion/meditation_loop.mp4
